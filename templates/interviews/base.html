{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ page_title|default:"PurrStone MVP" }}</title>

    <style>
        :root {
            --bg: #f7f9ff;
            --sidebar-bg: #ffffff;
            --card-bg: #ffffff;
            --border: #e3e8f5;
            --border-strong: #d7def0;
            --text: #07133d;
            --muted: #64748b;
            --muted-light: #94a3b8;
            --blue: #1557ff;
            --blue-soft: #eef4ff;
            --green: #16a34a;
            --green-soft: #eaf8ef;
            --amber: #d97706;
            --amber-soft: #fff7ed;
            --red: #dc2626;
            --red-soft: #fef2f2;
            --shadow: 0 10px 30px rgba(15, 23, 42, 0.04);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Inter, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        .app-shell {
            display: grid;
            grid-template-columns: 220px 1fr;
            min-height: 100vh;
        }

        .sidebar {
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            padding: 24px 18px;
            position: sticky;
            top: 0;
            height: 100vh;
        }

        .brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-bottom: 32px;
        }

        .brand-logo {
            width: 72px;
            height: 72px;
            object-fit: contain;
        }

        .brand-name {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: var(--text);
        }

        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px 12px;
            border-radius: 12px;
            color: #334155;
            text-decoration: none;
            font-size: 14px;
            font-weight: 650;
            border: 1px solid transparent;
        }

        .nav-link:hover {
            background: var(--blue-soft);
            color: var(--blue);
        }

        .nav-link.active {
            background: var(--blue-soft);
            color: var(--blue);
            border-color: #d8e5ff;
        }

        .nav-link.disabled {
            color: #9ca3af;
            cursor: not-allowed;
        }

        .nav-icon {
            width: 20px;
            height: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: currentColor;
        }

        .nav-icon svg {
            width: 17px;
            height: 17px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .main {
            padding: 34px 42px;
        }

        .content {
            max-width: 1360px;
            margin: 0 auto;
        }

        .overview-workflow-list {
            margin: 0;
            padding-left: 1.1rem;
            line-height: 1.55;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            margin-bottom: 22px;
        }

        .page-title-block h1 {
            margin: 0;
            font-size: 34px;
            line-height: 1.1;
            letter-spacing: -0.04em;
        }

        .subtitle {
            color: var(--muted);
            margin: 8px 0 0;
            font-size: 15px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 16px;
            margin-bottom: 18px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
            margin-bottom: 18px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 22px;
            box-shadow: var(--shadow);
            margin-bottom: 18px;
        }

        .card h2 {
            margin: 0 0 14px;
            font-size: 19px;
            letter-spacing: -0.02em;
        }

        .card p {
            line-height: 1.55;
        }

        .metric-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 18px;
            box-shadow: var(--shadow);
        }

        .metric-label {
            color: var(--muted);
            font-size: 13px;
            font-weight: 700;
        }

        .metric {
            font-size: 30px;
            font-weight: 800;
            margin: 6px 0 6px;
            letter-spacing: -0.04em;
        }

        .muted {
            color: var(--muted);
            font-size: 14px;
        }

        .status {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 5px 10px;
            border-radius: 999px;
            background: var(--green-soft);
            color: var(--green);
            font-size: 12px;
            font-weight: 800;
            white-space: nowrap;
        }

        .status-waiting {
            background: var(--amber-soft);
            color: var(--amber);
        }

        .status-neutral {
            background: var(--blue-soft);
            color: var(--blue);
        }

        .status-muted {
            background: #f1f5f9;
            color: #64748b;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            background: var(--blue);
            color: #fff;
            padding: 10px 14px;
            border-radius: 11px;
            font-weight: 800;
            font-size: 14px;
            border: 1px solid var(--blue);
            margin-right: 8px;
            margin-top: 12px;
        }

        .button-secondary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            background: #fff;
            color: var(--blue);
            padding: 10px 14px;
            border-radius: 11px;
            font-weight: 800;
            font-size: 14px;
            border: 1px solid #bcd0ff;
            margin-right: 8px;
            margin-top: 12px;
        }

        .table-card {
            overflow: hidden;
            padding: 0;
        }

        .table-card-header {
            padding: 20px 22px 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th, td {
            text-align: left;
            padding: 13px 18px;
            border-bottom: 1px solid #eef2f7;
            vertical-align: top;
        }

        th {
            color: var(--muted);
            font-size: 12px;
            font-weight: 800;
            text-transform: none;
            width: 170px;
        }

        tr:last-child td,
        tr:last-child th {
            border-bottom: none;
        }

        .workflow-strip {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 10px;
            margin-top: 14px;
        }

        .workflow-step {
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px;
            background: #fff;
            text-align: center;
        }

        .workflow-dot {
            width: 28px;
            height: 28px;
            margin: 0 auto 8px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f1f5f9;
            color: #64748b;
            font-weight: 800;
            font-size: 13px;
        }

        .workflow-step.ready .workflow-dot {
            background: var(--green-soft);
            color: var(--green);
        }

        .workflow-step.waiting .workflow-dot {
            background: #f8fafc;
            color: #94a3b8;
        }

        .workflow-step-title {
            font-size: 12px;
            font-weight: 800;
        }

        .workflow-step-status {
            margin-top: 4px;
            font-size: 11px;
            color: var(--muted);
        }

        .section-row {
            display: grid;
            grid-template-columns: 44px 1fr;
            gap: 14px;
            padding: 16px 0;
            border-bottom: 1px solid #eef2f7;
        }

        .section-row:last-child {
            border-bottom: none;
        }

        .section-number {
            width: 32px;
            height: 32px;
            border-radius: 999px;
            background: var(--blue-soft);
            color: var(--blue);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
        }

        code {
            background: #f1f5f9;
            padding: 3px 5px;
            border-radius: 5px;
        }
        .overview-title {
            font-size: 40px;
            font-weight: 800;
            letter-spacing: -0.045em;
            margin: 0 0 16px;
        }

        .overview-kicker {
            color: #475569;
            font-size: 16px;
            margin: 0 0 18px;
        }

        .overview-intro-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 16px;
            margin: 28px 0 20px;
        }

        .overview-info-card {
            display: grid;
            grid-template-columns: 52px 1fr;
            gap: 16px;
            align-items: flex-start;
            min-height: 190px;
        }

        .info-icon {
            width: 46px;
            height: 46px;
            border-radius: 16px;
            background: var(--blue-soft);
            color: var(--blue);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .info-icon svg {
            width: 25px;
            height: 25px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .metric-grid-4 {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 16px;
            margin-bottom: 18px;
        }

        .metric-grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin: 28px 0 20px;
        }

        .implemented-record-card {
            border: 1px solid var(--border);
            border-radius: 18px;
            background: #ffffff;
        }

        .future-strip {
            margin-top: 28px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
        }

        .future-strip-header {
            margin-bottom: 14px;
        }

        .future-strip-header h2 {
            margin-bottom: 6px;
        }

        .future-chip-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
        }

        .future-chip-card {
            border: 1px solid var(--border);
            border-radius: 14px;
            background: #ffffff;
            padding: 14px;
            min-height: 82px;
        }

        .future-chip-title {
            font-size: 13px;
            font-weight: 800;
            color: var(--navy);
            line-height: 1.3;
            margin-bottom: 10px;
        }

        .future-chip-text {
            font-size: 12px;
            color: var(--muted);
            line-height: 1.35;
        }

        .compact-record-card {
            display: grid;
            grid-template-columns: 1.8fr 1.8fr 0.9fr auto;
            gap: 22px;
            align-items: center;
            padding: 20px;
        }

        .record-main {
            min-width: 0;
        }

        .record-id {
            font-size: 24px;
            font-weight: 900;
            color: var(--navy);
            margin-bottom: 6px;
        }

        .record-subtitle {
            font-size: 13px;
            color: var(--muted);
            line-height: 1.35;
        }

        .record-meta {
            min-width: 0;
        }

        .record-label {
            font-size: 12px;
            font-weight: 800;
            color: var(--muted);
            margin-bottom: 6px;
        }

        .record-value {
            font-size: 14px;
            font-weight: 700;
            color: var(--navy);
            line-height: 1.35;
        }

        .record-action {
            display: flex;
            justify-content: flex-end;
        }

        .future-examples-header {
            margin-top: 28px;
        }

        .future-examples-note {
            margin: 0 0 16px;
        }

        .future-example-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }

        .future-example-card {
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            background: #ffffff;
        }

        .future-example-title {
            font-weight: 800;
            color: var(--navy);
            margin-bottom: 8px;
        }

        .future-example-purpose {
            color: var(--muted);
            line-height: 1.45;
            margin-bottom: 10px;
        }

        .future-example-workflow {
            font-weight: 700;
            color: var(--navy);
            margin-bottom: 12px;
        }

        .future-examples-header {
            margin-top: 28px;
        }
        
        .metric-card-horizontal {
            display: grid;
            grid-template-columns: 52px 1fr;
            gap: 14px;
            align-items: center;
        }

        .metric-icon {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: var(--blue-soft);
            color: var(--blue);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .metric-icon svg {
            width: 24px;
            height: 24px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .workflow-status-card {
            padding: 22px 28px;
        }

        .workflow-timeline {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            align-items: start;
            gap: 0;
            margin-top: 22px;
            position: relative;
        }

        .workflow-timeline::before {
            content: "";
            position: absolute;
            left: 8%;
            right: 8%;
            top: 22px;
            height: 4px;
            background: #d1d5db;
            z-index: 0;
        }

        .timeline-item {
            position: relative;
            z-index: 1;
            text-align: center;
        }

        .timeline-circle {
            width: 46px;
            height: 46px;
            border-radius: 999px;
            margin: 0 auto 10px;
            background: #ffffff;
            border: 2px solid #d1d5db;
            color: #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
        }

        .timeline-item.ready .timeline-circle {
            background: #58b861;
            border-color: #58b861;
            color: white;
            font-size: 26px;
        }

        .timeline-title {
            font-size: 14px;
            font-weight: 800;
        }

        .timeline-status {
            margin-top: 5px;
            font-size: 13px;
            color: var(--muted);
        }

        .timeline-item.ready .timeline-status {
            color: #58b861;
        }

        .timeline-item.warning .timeline-circle {
            background: var(--amber);
            border-color: var(--amber);
            color: #ffffff;
            font-size: 22px;
        }

        .timeline-item.warning .timeline-status {
            color: var(--amber);
        }

        .next-actions-card {
            padding: 22px 26px;
        }

        .action-list {
            color: #334155;
            font-size: 15px;
            line-height: 1.45;
            margin: 8px 0 16px;
            padding-left: 18px;
        }

        .action-buttons {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
        }

        .action-buttons .button,
        .action-buttons .button-secondary {
            margin: 0;
            width: 100%;
        }

        .button-disabled {
            background: #f8fafc !important;
            color: #94a3b8 !important;
            border-color: #dbe4f0 !important;
            opacity: 1;
            cursor: not-allowed;
            pointer-events: none;
        }
        
        .page-header-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 18px;
            margin-bottom: 18px;
        }

        .grouping-card {
            display: grid;
            grid-template-columns: 54px 1fr;
            gap: 16px;
            align-items: center;
            margin-bottom: 18px;
        }

        .grouping-card h2 {
            margin-bottom: 6px;
        }

        .stakeholder-metrics {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 16px;
            margin-bottom: 18px;
        }

        .stakeholder-table th,
        .stakeholder-table td {
            padding: 14px 14px;
            font-size: 13px;
        }

        .stakeholder-table th {
            width: auto;
        }

        .stakeholder-table td:first-child,
        .stakeholder-table th:first-child {
            width: 110px;
        }

        .stakeholder-table td:nth-child(2),
        .stakeholder-table th:nth-child(2) {
            width: 210px;
        }

        .stakeholder-table td:nth-child(3),
        .stakeholder-table th:nth-child(3) {
            width: 150px;
        }

        .stakeholder-table td:nth-child(4),
        .stakeholder-table th:nth-child(4) {
            width: 210px;
        }

        .stakeholder-table td:nth-child(5),
        .stakeholder-table th:nth-child(5) {
            width: 120px;
        }

        .stakeholder-table td:nth-child(6),
        .stakeholder-table th:nth-child(6) {
            width: 130px;
        }

        .stakeholder-table .button-secondary {
            margin: 0;
            padding: 8px 12px;
            font-size: 13px;
        }

        .stakeholder-layout {
            display: grid;
            grid-template-columns: minmax(760px, 1fr) 380px;
            gap: 18px;
            align-items: start;
        }

        .selected-panel {
            min-height: 420px;
        }

        .detail-list {
            display: grid;
            gap: 14px;
            margin: 18px 0;
        }

        .detail-row {
            display: grid;
            grid-template-columns: 120px 1fr;
            gap: 12px;
            align-items: center;
            font-size: 14px;
        }

        .detail-label {
            color: var(--muted);
            font-weight: 800;
        }

        .panel-actions {
            display: grid;
            gap: 10px;
            margin-top: 18px;
        }

        .panel-actions .button,
        .panel-actions .button-secondary {
            margin: 0;
            width: 100%;
        }

        .pagination-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            color: var(--muted);
            font-size: 14px;
        }

        .pagination-controls {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .page-chip {
            width: 34px;
            height: 34px;
            border-radius: 9px;
            background: var(--blue);
            color: white;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
        }

        .small-outline {
            width: 34px;
            height: 34px;
            border-radius: 9px;
            border: 1px solid var(--border-strong);
            background: white;
            color: var(--muted);
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .record-meta-row {
            display: flex;
            gap: 22px;
            align-items: center;
            margin: 18px 0 24px;
            color: var(--muted);
            font-size: 14px;
        }

        .record-meta-item {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .record-meta-icon {
            width: 20px;
            height: 20px;
            color: var(--blue);
        }

        .record-meta-icon svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .record-layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(460px, 1.05fr);
            gap: 18px;
            align-items: stretch;
        }

        .record-left-stack {
            display: grid;
            gap: 18px;
        }

        .record-card {
            min-height: auto;
        }

        .protocol-card-large {
            min-height: auto;
        }

        .record-table th,
        .record-table td {
            padding: 10px 16px;
            font-size: 13px;
        }

        .progress-list {
            display: grid;
            gap: 0;
        }

        .progress-row {
            display: grid;
            grid-template-columns: 30px 1fr auto;
            gap: 10px;
            align-items: center;
            padding: 9px 0;
            border-bottom: 1px solid #eef2f7;
        }

        .progress-row:last-child {
            border-bottom: none;
        }

        .progress-icon {
            width: 20px;
            height: 20px;
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 900;
        }
        .progress-icon svg {
            width: 12px;
            height: 12px;
            stroke: currentColor;
            stroke-width: 3;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .progress-complete {
            background: var(--green);
            color: white;
        }

        .progress-pending {
            background: #fff7ed;
            color: var(--amber);
            border: 1px solid #fed7aa;
        }

        .progress-waiting {
            background: #eef2ff;
            color: var(--blue);
            border: 1px solid #bfdbfe;
        }

        .progress-muted {
            background: #f1f5f9;
            color: #64748b;
            border: 1px solid #dbe4f0;
        }

        .action-bar {
            margin-top: 14px;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 14px;
            box-shadow: var(--shadow);
            display: grid;
            grid-template-columns: 1fr 1.1fr 1fr;
            gap: 12px;
        }

        .action-bar .button,
        .action-bar .button-secondary {
            margin: 0;
            width: 100%;
        }

        .protocol-flow-card {
            min-height: 260px;
        }
        
        .protocol-details {
            padding: 0;
            overflow: hidden;
        }

        .protocol-details summary {
            list-style: none;
            cursor: pointer;
            padding: 20px 22px;
            font-size: 18px;
            font-weight: 800;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .protocol-details summary::-webkit-details-marker {
            display: none;
        }

        .protocol-page .overview-title {
            font-size: 36px;
            margin-bottom: 12px;
        }

        .protocol-page .overview-kicker {
            margin-bottom: 14px;
        }

        .protocol-page .grid-2 {
            gap: 16px;
            margin-bottom: 16px;
            align-items: start;
        }

            background: #fff7ed;

        }

        .quality-metric-number {
            font-size: 32px;
            font-weight: 900;
            color: var(--navy);
            line-height: 1;
        }

        .quality-metric-label {
            margin-top: 6px;
            font-weight: 900;
            color: var(--navy);
        }

        .quality-card-link {
            display: inline-block;
            margin-top: 14px;
            color: var(--blue);
            font-weight: 900;
            text-decoration: none;
        }

        .output-readiness-card {
            margin-bottom: 22px;
        }

        .card-heading-row h2 {
            margin: 0;
        }

        .card-heading-row p,
        .quality-card-subtitle {
            margin: 8px 0 0;
            color: var(--muted);
            line-height: 1.5;
        }

        .quality-table {
            margin-top: 18px;
        }

        .participant-pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 8px 10px;
            border-radius: 8px;
            background: #eaf2ff;
            color: var(--blue);
            font-weight: 900;
        }

        .table-action-link {
            color: var(--blue);
            font-weight: 900;
            text-decoration: none;
        }

        .quality-table-footer {
            text-align: center;
            margin-top: 18px;
        }

        .quality-table-footer a {
            color: var(--blue);
            font-weight: 900;
            text-decoration: none;
        }

        .quality-two-column {
            display: grid;
            grid-template-columns: 1fr 1.25fr;
            gap: 22px;
            margin-bottom: 22px;
        }

        .quality-check-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px 24px;
            margin-top: 24px;
        }

        .quality-check-item {
            display: grid;
            grid-template-columns: 26px 1fr;
            gap: 12px;
            align-items: start;
        }

        .quality-check-icon {
            width: 22px;
            height: 22px;
            border-radius: 999px;
            background: #ecfdf3;
            color: #16a34a;
            border: 2px solid #22c55e;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 900;
        }

        .quality-check-item strong,
        .evidence-item strong {
            color: var(--navy);
            font-weight: 900;
        }

        .quality-check-item p,
        .evidence-item p {
            margin: 5px 0 0;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.4;
        }

        .quality-bottom-link {
            display: block;
            text-align: center;
            margin-top: 24px;
        }

        .evidence-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px 22px;
            margin-top: 24px;
        }

        .evidence-item {
            display: grid;
            grid-template-columns: 44px 1fr auto;
            gap: 14px;
            align-items: center;
        }

        .evidence-icon {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            background: #eef4ff;
            color: var(--blue);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .evidence-icon svg {
            width: 22px;
            height: 22px;
        }

        .next-actions-card {
            margin-bottom: 40px;
        }

        .quality-next-actions {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 18px;
            margin-top: 18px;
        }

        .quality-next-action {
            display: grid;
            grid-template-columns: 44px 1fr auto;
            gap: 14px;
            align-items: center;
            padding: 16px 18px;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: #ffffff;
            text-decoration: none;
            color: var(--navy);
        }

        .quality-next-action strong {
            font-weight: 900;
        }

        .quality-next-action p {
            margin: 4px 0 0;
            color: var(--muted);
            font-size: 13px;
        }

        .quality-next-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            border: 1px solid #cfe0ff;
            color: var(--blue);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
        }

        .disabled-action {
            opacity: 0.65;
            pointer-events: none;
        }

        @media (max-width: 1200px) {
            .quality-metric-grid,
            .quality-two-column,
            .quality-next-actions {
                grid-template-columns: 1fr;
            }

            .quality-check-grid,
            .evidence-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Compact Output Quality page */
        .quality-metric-grid {
            gap: 16px;
            margin-bottom: 18px;
        }

        .quality-metric-card {
            padding: 18px 20px;
            min-height: 92px;
        }

        .quality-metric-icon {
            width: 48px;
            height: 48px;
        }

        .quality-metric-icon svg {
            width: 24px;
            height: 24px;
        }

        .quality-metric-number {
            font-size: 26px;
        }

        .quality-card-link {
            margin-top: 8px;
            font-size: 14px;
        }

        .output-readiness-card {
            margin-bottom: 18px;
        }

        .output-readiness-card .stakeholder-table th,
        .output-readiness-card .stakeholder-table td {
            padding-top: 14px;
            padding-bottom: 14px;
        }

        .quality-table-footer {
            margin-top: 10px;
        }

        .quality-two-column {
            gap: 18px;
            margin-bottom: 18px;
        }

        .quality-check-card,
        .evidence-card {
            min-height: 260px;
        }

        .quality-check-grid {
            gap: 12px 18px;
            margin-top: 18px;
        }

        .quality-check-item {
            gap: 10px;
        }

        .quality-check-item p,
        .evidence-item p {
            font-size: 12px;
            line-height: 1.35;
        }

        .evidence-grid {
            gap: 14px 18px;
            margin-top: 18px;
        }

        .evidence-item {
            grid-template-columns: 36px 1fr auto;
            gap: 10px;
        }

        .evidence-icon {
            width: 34px;
            height: 34px;
        }

        .evidence-icon svg {
            width: 18px;
            height: 18px;
        }

        /* Stakeholder page final layout */
        .stakeholder-main-card {
            padding: 0;
            overflow: hidden;
        }

        .stakeholder-card-header {
            padding: 22px 24px 14px;
            border-bottom: 1px solid var(--border);
        }

        .stakeholder-card-header h2 {
            margin: 0 0 6px;
        }

        .stakeholder-card-header p {
            margin: 0;
        }

        .p01-record-card {
            display: grid;
            grid-template-columns: 1.3fr 1px 1.4fr 0.75fr auto;
            gap: 22px;
            align-items: center;
            padding: 24px;
            background: #ffffff;
        }

        .p01-record-primary {
            min-width: 0;
        }

        .p01-id {
            font-size: 34px;
            font-weight: 900;
            letter-spacing: -0.05em;
            color: var(--text);
            margin-bottom: 8px;
        }

        .p01-title {
            font-size: 15px;
            font-weight: 850;
            color: var(--text);
            line-height: 1.3;
        }

        .p01-subtitle {
            margin-top: 5px;
            font-size: 13px;
            color: var(--muted);
        }

        .p01-record-divider {
            width: 1px;
            height: 76px;
            background: var(--border);
        }

        .p01-record-info {
            min-width: 0;
        }

        .p01-record-action {
            display: flex;
            justify-content: flex-end;
        }

        .p01-record-action .button-secondary {
            margin: 0;
            min-width: 168px;
        }

        .future-inline-section {
            border-top: 1px solid var(--border);
            background: #fbfdff;
            padding: 22px 24px 24px;
        }

        .future-inline-header {
            display: flex;
            justify-content: space-between;
            gap: 24px;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .future-inline-header h2 {
            margin: 0;
            white-space: nowrap;
        }

        .future-inline-header p {
            margin: 0;
            max-width: 620px;
        }

        .future-inline-list {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .future-inline-item {
            display: grid;
            grid-template-columns: 1.1fr 1fr;
            gap: 12px;
            align-items: center;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: #ffffff;
        }

        .future-inline-item strong {
            color: var(--text);
            font-size: 13px;
            line-height: 1.3;
        }

        .future-inline-item span {
            color: var(--muted);
            font-size: 12px;
            line-height: 1.35;
        }

        @media (max-width: 1100px) {
            .p01-record-card {
                grid-template-columns: 1fr;
            }

            .p01-record-divider {
                display: none;
            }

            .p01-record-action {
                justify-content: flex-start;
            }

            .future-inline-header {
                display: block;
            }

            .future-inline-header h2 {
                margin-bottom: 8px;
            }

            .future-inline-list {
                grid-template-columns: 1fr;
            }

            .future-inline-item {
                grid-template-columns: 1fr;
            }
        }

        .protocol-action-bar.protocol-action-bar-single {
            grid-template-columns: 1fr !important;
        }

        .protocol-action-bar.protocol-action-bar-single .button-secondary {
            width: 100%;
            text-align: center;
            margin: 0;
        }

        .protocol-page .research-data-card {
            margin-bottom: 16px;
        }

        .protocol-page .research-data-card .key-section-list {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .protocol-page .research-data-card .key-section-item {
            border: 1px solid var(--border);
            border-radius: 12px;
            background: #ffffff;
            padding: 12px;
            display: grid;
            grid-template-columns: 28px 1fr;
            gap: 10px;
        }

        .protocol-page .research-data-card .key-section-item {
            border-bottom: 1px solid var(--border);
        }

        .protocol-page .research-data-card .key-section-item:last-child {
            border-bottom: 1px solid var(--border);
        }

        .protocol-page .research-data-card .key-section-number {
            width: 24px;
            height: 24px;
            font-size: 11px;
        }

        .protocol-page .research-data-card .key-section-item p {
            margin: 4px 0 0;
            font-size: 12px;
            line-height: 1.3;
        }

        .protocol-page .agent-rules-wide-card {
            margin-bottom: 16px;
        }

        .protocol-page .agent-rules-wide-card .ethics-list {
            columns: 2;
            column-gap: 40px;
            font-size: 13px;
            line-height: 1.55;
        }

        .protocol-page .agent-rules-wide-card .ethics-list li {
            break-inside: avoid;
            margin-bottom: 4px;
        }

        @media (max-width: 900px) {
            .protocol-page .research-data-card .key-section-list {
                grid-template-columns: 1fr;
            }

            .protocol-page .agent-rules-wide-card .ethics-list {
                columns: 1;
            }
        }
        
        .stakeholder-layout {
            align-items: stretch;
        }

        .stakeholder-main-card,
        .selected-panel {
            height: 100%;
        }

        .selected-panel {
            display: flex;
            flex-direction: column;
        }

        .selected-panel .panel-actions {
            margin-top: auto;
        }

        .figma-chat-card {
            min-height: auto;
        }

        .figma-messages {
            min-height: 300px;
            max-height: 430px;
            overflow-y: auto;
        }

        .topic-label-partial {
            background: #fff7ed;
            color: #d97706;
        }
        
        .review-criteria-list {
            margin: 18px 0 0;
            padding: 0;
            list-style: none;
            display: grid;
            gap: 12px;
        }

        .review-criteria-list li {
            position: relative;
            padding-left: 22px;
            font-weight: 800;
            color: var(--text);
        }

        .review-criteria-list li::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0.65em;
            width: 7px;
            height: 7px;
            border-radius: 999px;
            background: #64748b;
        }

        .review-criteria-form-list {
            margin-top: 18px;
            display: grid;
            gap: 12px;
        }

        .review-criteria-check {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            color: var(--text);
        }

        .review-criteria-check input {
            width: 18px;
            height: 18px;
            accent-color: #2563eb;
        }

        .form-error {
            margin: 12px 0 0;
            padding: 10px 12px;
            border-radius: 12px;
            background: #fff7ed;
            color: #d97706;
            font-weight: 800;
        }

        .quality-check-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-top: 16px;
        }

        .quality-check-item {
            display: grid;
            grid-template-columns: 120px 1fr;
            align-items: start;
            gap: 14px;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: #fbfdff;
        }

        .quality-check-item .status {
            justify-self: start;
            white-space: nowrap;
        }

        .quality-check-item strong {
            display: block;
            font-size: 15px;
            line-height: 1.25;
        }

        .quality-check-item p {
            margin: 5px 0 0;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.35;
        }

        .quality-confirmed-summary {
            margin-top: 10px;
            margin-bottom: 12px;
        }

        /* Final Evidence Status layout */
        .quality-check-grid,
        .evidence-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin-top: 16px;
        }

        .quality-check-item,
        .evidence-item {
            min-height: 64px;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: #fbfdff;
        }

        .quality-check-item {
            display: grid;
            grid-template-columns: 120px 1fr;
            align-items: start;
            gap: 14px;
        }

        .evidence-item {
            display: grid;
            grid-template-columns: 36px 1fr auto;
            align-items: start;
            gap: 12px;
        }

        .quality-check-item .status,
        .evidence-item .status {
            white-space: nowrap;
            justify-self: start;
        }

        .evidence-item .status {
            justify-self: end;
        }

        .quality-check-item strong,
        .evidence-item strong {
            display: block;
            font-size: 15px;
            line-height: 1.25;
        }

        .quality-check-item p,
        .evidence-item p {
            margin: 5px 0 0;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.35;
        }

        .quality-confirmed-summary {
            margin-top: 10px;
            margin-bottom: 12px;
        }

        .criteria-record-list {
            display: grid;
            gap: 9px;
            margin-top: 12px;
        }

        .criteria-record-item {
            display: grid;
            grid-template-columns: 120px 1fr;
            gap: 12px;
            align-items: start;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: #fbfdff;
        }

        .criteria-record-item strong {
            display: block;
            font-size: 14px;
            line-height: 1.3;
        }

        .criteria-record-list {
            display: grid;
            gap: 9px;
            margin-top: 12px;
        }

        .criteria-record-item {
            display: grid;
            grid-template-columns: 115px 1fr;
            gap: 12px;
            align-items: center;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: #fbfdff;
        }

        .criteria-record-item .badge {
            justify-self: start;
        }

        .criteria-record-item strong {
            display: block;
            font-size: 14px;
            line-height: 1.3;
        }

    </style>
</head>

<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="brand">
                <img class="brand-logo" src="{% static 'interviews/img/purrstone-logo.png' %}" alt="PurrStone logo">
                <div class="brand-name">PurrStone</div>
            </div>

           <nav class="sidebar-nav">
                <a class="nav-link {% if request.resolver_match.url_name == 'overview' %}active{% endif %}" href="{% url 'overview' %}">
                    <span class="nav-icon">
                        <svg viewBox="0 0 24 24">
                            <path d="M3 11.5L12 4l9 7.5"></path>
                            <path d="M5.5 10.5V20h13v-9.5"></path>
                            <path d="M9.5 20v-5h5v5"></path>
                        </svg>
                    </span>
                    <span>Overview</span>
                </a>

                <a class="nav-link {% if request.resolver_match.url_name == 'stakeholder_list' or request.resolver_match.url_name == 'stakeholder_detail' %}active{% endif %}" href="{% url 'stakeholder_list' %}">
                    <span class="nav-icon">
                        <svg viewBox="0 0 24 24">
                            <path d="M16 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"></path>
                            <circle cx="9.5" cy="7" r="4"></circle>
                            <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                        </svg>
                    </span>
                    <span>Stakeholders</span>
                </a>

                <a class="nav-link {% if request.resolver_match.url_name == 'protocol_detail' %}active{% endif %}" href="{% url 'protocol_detail' 'sensory-overload-interview' %}">
                    <span class="nav-icon">
                        <svg viewBox="0 0 24 24">
                            <path d="M7 3h7l5 5v13H7z"></path>
                            <path d="M14 3v5h5"></path>
                            <path d="M9.5 13h7"></path>
                            <path d="M9.5 17h5"></path>
                        </svg>
                    </span>
                    <span>Protocols</span>
                </a>

                <a class="nav-link {% if request.resolver_match.url_name == 'interview_sessions' %}active{% endif %}" href="{% url 'interview_sessions' %}">
                    <span class="nav-icon">
                        <svg viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="9"></circle>
                            <path d="M9.5 9.5h5v5h-5z"></path>
                        </svg>
                    </span>
                    <span>Interviews</span>
                </a>

                <a class="nav-link {% if request.resolver_match.url_name == 'outputs_home' or request.resolver_match.url_name == 'output_detail' %}active{% endif %}" href="{% url 'outputs_home' %}">
                    <span class="nav-icon">
                        <svg viewBox="0 0 24 24">
                            <path d="M5 4H19"></path>
                            <path d="M19 4V20"></path>
                            <path d="M19 20H5"></path>
                            <path d="M5 20V4"></path>
                            <path d="M8 8H16"></path>
                            <path d="M8 12H16"></path>
                            <path d="M8 16H13"></path>
                        </svg>
                    </span>
                    <span>Output Review</span>
                </a>

                <a class="nav-link {% if request.resolver_match.url_name == 'output_quality' %}active{% endif %}" href="{% url 'output_quality' %}">
                    <span class="nav-icon">
                        <svg viewBox="0 0 24 24">
                            <path d="M4 20V10"></path>
                            <path d="M10 20V4"></path>
                            <path d="M16 20v-7"></path>
                            <path d="M22 20H2"></path>
                        </svg>
                    </span>
                    <span>Evidence Status</span>
                </a>
            </nav>
        </aside>

        <main class="main">
            <div class="content">
                {% block content %}
                {% endblock %}
            </div>
        </main>
    </div>
</body>
</html>
