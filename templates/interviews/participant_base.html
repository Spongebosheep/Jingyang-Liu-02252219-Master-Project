{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ page_title|default:"PurrStone Interview" }}</title>

    <style>
        :root {
            --bg: #f7f9ff;
            --card: #ffffff;
            --border: #dbe4f0;
            --text: #07133d;
            --muted: #64748b;
            --blue: #1557ff;
            --blue-soft: #eef4ff;
            --green: #16a34a;
            --green-soft: #eaf8ef;
            --amber: #d97706;
            --amber-soft: #fff7ed;
            --red: #dc2626;
            --red-soft: #fef2f2;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: Inter, Arial, sans-serif;
        }

        .interview-shell {
            max-width: 1180px;
            margin: 0 auto;
            padding: 34px 28px;
        }

        .interview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 18px;
            margin-bottom: 26px;
        }

        .brand-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-row img {
            width: 48px;
            height: 48px;
            object-fit: contain;
        }

        .brand-name {
            font-weight: 900;
            font-size: 18px;
        }

        h1 {
            font-size: 38px;
            letter-spacing: -0.045em;
            margin: 0 0 8px;
        }

        .subtitle {
            color: var(--muted);
            margin: 0 0 22px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.04);
            margin-bottom: 18px;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--blue);
            background: var(--blue);
            color: white;
            border-radius: 12px;
            padding: 12px 18px;
            font-weight: 900;
            font-size: 14px;
            text-decoration: none;
            cursor: pointer;
        }

        .button-secondary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #bcd0ff;
            background: white;
            color: var(--blue);
            border-radius: 12px;
            padding: 12px 18px;
            font-weight: 900;
            font-size: 14px;
            text-decoration: none;
            cursor: pointer;
        }

        .button-danger {
            border-color: #fecaca;
            background: white;
            color: var(--red);
        }

        .button-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }

        .status {
            display: inline-flex;
            padding: 5px 10px;
            border-radius: 999px;
            background: var(--green-soft);
            color: var(--green);
            font-size: 12px;
            font-weight: 900;
        }

        .status-waiting {
            background: var(--amber-soft);
            color: var(--amber);
        }

        .notice {
            background: var(--blue-soft);
            border: 1px solid #cfe0ff;
            border-radius: 14px;
            padding: 14px 16px;
            color: #334155;
        }

        .error {
            background: var(--red-soft);
            color: var(--red);
            border: 1px solid #fecaca;
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 14px;
            font-weight: 800;
        }

        .stepper {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 8px;
            margin-bottom: 18px;
        }

        .step {
            text-align: center;
            color: var(--muted);
            font-size: 12px;
            font-weight: 800;
        }

        .step-circle {
            width: 34px;
            height: 34px;
            border-radius: 999px;
            margin: 0 auto 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            border: 1px solid var(--border);
            color: var(--muted);
        }

        .step.done .step-circle {
            background: var(--green-soft);
            color: var(--green);
            border-color: #bbf7d0;
        }

        .step.active .step-circle {
            background: var(--blue);
            color: white;
            border-color: var(--blue);
        }

        .chat-card {
            height: 560px;
            max-height: 560px;
            min-height: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .messages {
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 8px;
        }

        .chat-card form {
            flex: 0 0 auto;
        }

        .input-area {
            flex: 0 0 auto;
            border-top: 1px solid #eef2f7;
            padding-top: 16px;
            background: #ffffff;
        }

        .message-row {
            display: flex;
            margin-bottom: 14px;
        }

        .message-row.agent {
            justify-content: flex-start;
        }

        .message-row.participant {
            justify-content: flex-end;
        }

        .message-row.system {
            justify-content: center;
        }

        .bubble {
            max-width: 68%;
            border-radius: 16px;
            padding: 14px 16px;
            line-height: 1.5;
            border: 1px solid var(--border);
            background: #f8fbff;
        }

        .message-row.participant .bubble {
            background: #e8f0ff;
            border-color: #d6e2ff;
        }

        .message-row.system .bubble {
            background: #f8fafc;
            color: var(--muted);
            font-size: 13px;
        }

        textarea {
            width: 100%;
            min-height: 90px;
            border: 1px solid #bcd0ff;
            border-radius: 14px;
            padding: 14px;
            font-family: inherit;
            font-size: 15px;
            resize: vertical;
        }

        .input-area {
            display: grid;
            grid-template-columns: 1fr 150px;
            gap: 12px;
            border-top: 1px solid #eef2f7;
            padding-top: 16px;
        }

        @media (max-width: 820px) {
            .stepper {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .input-area {
                grid-template-columns: 1fr;
            }

            .bubble {
                max-width: 92%;
            }

            h1 {
                font-size: 30px;
            }
        }

        /* Phase 4.5 completed page, Figma-aligned */
        .completed-page-v2 {
            max-width: 940px;
            margin: 0 auto;
        }

        .completed-topic-check.stopped-topic {
            background: var(--blue-soft);
            color: var(--blue);
        }

        .completed-card-v2 {
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 34px 48px 28px;
            box-shadow: 0 14px 40px rgba(15, 23, 42, 0.08);
        }

        .completed-hero-v2 {
            text-align: center;
            margin-bottom: 30px;
        }

        .completed-icon-v2 {
            width: 74px;
            height: 74px;
            border-radius: 50%;
            margin: 0 auto 16px;
            background: var(--green-soft);
            color: var(--green);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 0 12px rgba(22, 163, 74, 0.08);
        }

        .completed-icon-v2.stopped {
            background: var(--amber-soft);
            color: var(--amber);
            box-shadow: 0 0 0 12px rgba(217, 119, 6, 0.08);
        }

        .completed-icon-v2 svg {
            width: 40px;
            height: 40px;
            stroke: currentColor;
            stroke-width: 2.4;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .completed-hero-v2 h1 {
            font-size: 42px;
            margin: 0 0 12px;
            letter-spacing: -0.045em;
        }

        .completed-hero-v2 p {
            max-width: 560px;
            margin: 0 auto;
            color: var(--muted);
            font-size: 18px;
            line-height: 1.55;
        }

        .completed-two-column {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 28px;
            margin-bottom: 24px;
        }

        .completed-panel {
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 22px;
            background: #ffffff;
        }

        .completed-panel h2 {
            margin: 0 0 18px;
            font-size: 22px;
        }

        .completed-status-row,
        .completed-topic-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            padding: 13px 0;
            border-bottom: 1px solid #eef2f7;
            font-size: 16px;
        }

        .completed-status-row:last-child,
        .completed-topic-row:last-child {
            border-bottom: none;
        }

        .completed-status-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .completed-mini-icon,
        .completed-topic-check {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: var(--blue-soft);
            color: var(--blue);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 auto;
        }

        .completed-mini-icon svg,
        .completed-topic-check svg,
        .completed-boundary-icon svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .completed-topic-check {
            background: var(--green-soft);
            color: var(--green);
        }

        .completed-topic-list {
            display: grid;
        }

        .completed-topic-row {
            justify-content: flex-start;
            font-weight: 700;
            color: #334155;
        }

        .completed-info-note,
        .completed-boundary-note {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 18px;
            color: #475569;
            font-size: 16px;
        }

        .completed-info-note {
            border-bottom: 1px solid #eef2f7;
        }

        .completed-info-icon {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2px solid var(--blue);
            color: var(--blue);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            flex: 0 0 auto;
        }

        .completed-boundary-icon {
            width: 30px;
            height: 30px;
            color: var(--blue);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 auto;
        }

        .completed-finish-row {
            display: flex;
            justify-content: center;
            margin-top: 24px;
        }

        .completed-finish-button {
            min-width: 300px;
            font-size: 18px;
            padding: 16px 22px;
        }

        @media (max-width: 860px) {
            .completed-card-v2 {
                padding: 28px 24px;
            }

            .completed-two-column {
                grid-template-columns: 1fr;
            }

            .completed-hero-v2 h1 {
                font-size: 34px;
            }
        }

        /* Phase 4.5 interview page aligned to Figma */
        .figma-interview-page {
            max-width: 1080px;
            margin: 0 auto;
        }

        .interview-title-row h1 {
            font-size: 44px;
            margin-bottom: 6px;
        }

        .figma-stepper {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 0;
            margin: 28px 0 16px;
            position: relative;
        }

        .figma-stepper::before {
            content: "";
            position: absolute;
            top: 18px;
            left: 7%;
            right: 7%;
            height: 2px;
            background: #dbe4f0;
            z-index: 0;
        }

        .figma-step {
            position: relative;
            z-index: 1;
            text-align: center;
            color: #475569;
            font-weight: 800;
        }

        .figma-step-circle {
            width: 38px;
            height: 38px;
            border-radius: 999px;
            background: #ffffff;
            border: 1px solid var(--border);
            color: #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 8px;
            font-weight: 900;
        }

        .figma-step.done .figma-step-circle {
            background: var(--green-soft);
            color: var(--green);
            border-color: #bbf7d0;
        }

        .figma-step.active .figma-step-circle {
            background: var(--blue);
            color: white;
            border-color: var(--blue);
        }

        .figma-step-label {
            font-size: 13px;
            line-height: 1.2;
        }

        .interview-control-note {
            text-align: center;
            color: #475569;
            font-weight: 700;
            margin: 12px 0 12px;
        }

        .figma-chat-card {
            height: 560px !important;
            max-height: 560px !important;
            min-height: 0 !important;
            overflow: hidden !important;
            padding: 22px !important;
            display: flex !important;
            flex-direction: column !important;
            border-radius: 18px;
        }

        .figma-messages {
            flex: 1 1 auto !important;
            min-height: 0 !important;
            overflow-y: auto !important;
            padding: 4px 8px 12px !important;
        }

        .figma-message-row {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            margin-bottom: 18px;
        }

        .figma-message-row.agent {
            justify-content: flex-start;
        }

        .figma-message-row.participant {
            justify-content: flex-end;
        }

        .figma-message-row.system {
            justify-content: center;
        }

        .message-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #cfe0ff;
            background: #f7fbff;
            color: var(--blue);
        }

        .message-avatar svg {
            width: 26px;
            height: 26px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .figma-bubble {
            max-width: 60%;
            border-radius: 14px;
            padding: 14px 18px;
            line-height: 1.45;
            font-size: 16px;
        }

        .agent-bubble {
            background: #f4f8ff;
            border: 1px solid #dbe8ff;
        }

        .participant-bubble {
            background: #e8f0ff;
            border: 1px solid #d6e2ff;
        }

        .system-bubble {
            background: #f8fafc;
            color: var(--muted);
            font-size: 13px;
            max-width: 70%;
        }

        .figma-input-form {
            flex: 0 0 auto !important;
            border-top: 1px solid #eef2f7;
            padding-top: 14px;
        }

        .figma-input-area {
            display: grid;
            grid-template-columns: 1fr 160px;
            gap: 14px;
            align-items: stretch;
        }

        .figma-input-area textarea {
            min-height: 64px;
            height: 64px;
            resize: none;
            border-radius: 12px;
        }

        .figma-send-button {
            height: 64px;
            border-radius: 12px;
            font-size: 16px;
        }

        .input-help {
            margin: 10px 0 0;
            color: var(--muted);
            font-size: 13px;
        }

        .bottom-safety-note {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            color: #475569;
            text-align: center;
            margin-top: 18px;
            font-size: 14px;
        }

        .bottom-safety-note span {
            color: var(--muted);
        }

        .bottom-safety-icon {
            width: 28px;
            height: 28px;
            color: var(--blue);
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .bottom-safety-icon svg {
            width: 24px;
            height: 24px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        @media (max-width: 900px) {
            .figma-stepper {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                row-gap: 18px;
            }

            .figma-stepper::before {
                display: none;
            }

            .figma-input-area {
                grid-template-columns: 1fr;
            }

            .figma-bubble {
                max-width: 82%;
            }

            .interview-title-row h1 {
                font-size: 34px;
            }
        }

        /* Phase 4.5 consent page */
        .consent-page {
            max-width: 760px;
            margin: 0 auto;
        }

        .consent-card {
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 24px 34px 20px;
            box-shadow: 0 14px 40px rgba(15, 23, 42, 0.08);
        }

        .consent-logo-block {
            text-align: center;
            margin-bottom: 18px;
        }

        .consent-logo-block img {
            width: 64px;
            height: 64px;
            object-fit: contain;
            margin-bottom: 8px;
        }

        .consent-logo-block .brand-name-centered {
            font-size: 18px;
            font-weight: 800;
        }

        .consent-title {
            text-align: center;
            font-size: 36px;
            line-height: 1.1;
            letter-spacing: -0.045em;
            margin: 8px 0 4px;
        }

        .consent-protocol {
            text-align: center;
            color: var(--blue);
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 12px;
        }

        .consent-intro {
            text-align: center;
            color: var(--muted);
            font-size: 14px;
            margin: 0 0 22px;
        }

        .consent-section {
            display: grid;
            grid-template-columns: 78px 1fr;
            gap: 18px;
            align-items: center;
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 14px 20px;
            margin-bottom: 10px;
            background: #ffffff;
        }

        .consent-section-icon {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: var(--blue-soft);
            color: var(--blue);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .consent-section-icon svg {
            width: 32px;
            height: 32px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .consent-section h2 {
            font-size: 18px;
            margin: 0 0 8px;
            letter-spacing: -0.02em;
        }

        .consent-section p {
            margin: 0;
            color: #334155;
            line-height: 1.45;
        }

        .consent-section ul {
            margin: 0;
            padding-left: 18px;
            color: #334155;
            line-height: 1.55;
        }

        .consent-divider {
            border: 0;
            border-top: 1px solid #eef2f7;
            margin: 16px 0;
        }

        .consent-check-row {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            color: #334155;
            font-size: 14px;
            margin-bottom: 18px;
        }

        .consent-check-row input {
            width: 22px;
            height: 22px;
            margin-top: 0;
            accent-color: var(--blue);
        }

        .consent-start-button {
            width: 360px;
            max-width: 100%;
            margin: 0 auto;
            display: flex;
            font-size: 16px;
            padding: 14px 20px;
        }

        @media (max-width: 760px) {
            .consent-card {
                padding: 22px;
            }

            .consent-section {
                grid-template-columns: 1fr;
            }

            .consent-section-icon {
                margin: 0 auto;
            }

            .consent-title {
                font-size: 30px;
            }
        }

        .completed-topic-row {
            display: grid;
            grid-template-columns: 32px 1fr auto;
            align-items: center;
            gap: 12px;
        }

        .completed-topic-check.topic-answered {
            background: var(--green-soft);
            color: var(--green);
        }

        .completed-topic-check.topic-skipped {
            background: var(--amber-soft);
            color: var(--amber);
        }

        .completed-topic-check.topic-stopped {
            background: var(--amber-soft);
            color: var(--amber);
        }

        .completed-topic-check.topic-reached {
            background: var(--blue-soft);
            color: var(--blue);
        }

        .completed-topic-check.topic-not_reached {
            background: #f1f5f9;
            color: #94a3b8;
        }

        .topic-status-label {
            font-size: 12px;
            font-weight: 900;
            border-radius: 999px;
            padding: 5px 9px;
        }

        .topic-label-answered {
            background: var(--green-soft);
            color: var(--green);
        }

        .topic-label-skipped,
        .topic-label-stopped {
            background: var(--amber-soft);
            color: var(--amber);
        }

        .topic-label-reached {
            background: var(--blue-soft);
            color: var(--blue);
        }

        .topic-label-not_reached {
            background: #f1f5f9;
            color: #64748b;
        }

    </style>
</head>

<body>
    <main class="interview-shell">
        {% block participant_header %}
        <header class="interview-header">
            <div class="brand-row">
                <img src="{% static 'interviews/img/purrstone-logo.png' %}" alt="PurrStone logo">
                <div class="brand-name">PurrStone</div>
            </div>

            {% block header_actions %}
            {% endblock %}
        </header>
        {% endblock %}

        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
